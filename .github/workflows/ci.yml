name: analytics checks
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
concurrency:
  group: analytics-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Official SDK runner
        run: python -m pip install uv==0.9.5
      - name: Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component clippy,rustfmt && rustup default 1.99.0
      - name: Install browser dependencies
        run: |
          npm ci
          npm --prefix examples/producers ci --ignore-scripts
      - name: Install real browser
        run: npx playwright install --with-deps chromium
      - name: Build and static checks
        run: make build check
      - name: Complete disposable acceptance
        run: make acceptance
      - name: Upload non-secret command evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-command-evidence
          path: |
            artifacts/acceptance/commands.json
            artifacts/benchmarks/service.json
          if-no-files-found: warn
          retention-days: 7

  publish:
    name: Publish public container
    needs: acceptance
    if: github.event_name == 'push' && github.repository == 'unbought-games/analytics'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require release tags to reference main history
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 -c 'import os,re; assert re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?", os.environ["RELEASE_TAG"]), "Expected semantic version tag"'
          git merge-base --is-ancestor HEAD origin/main
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        id: metadata
        with:
          images: ghcr.io/unbought-games/analytics
          flavor: latest=false
          tags: |
            type=sha,format=long
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: image
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Record immutable image
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: echo "ghcr.io/unbought-games/analytics@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
